appId: com.chriscorbell.pier
productName: Pier
copyright: MIT License
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Signed with a Developer ID certificate when CSC_LINK is set (release workflow), ad-hoc otherwise.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarized when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are set; skipped otherwise.
  notarize: true
  darkModeSupport: true
  minimumSystemVersion: "13.0"
  extendInfo:
    CFBundleName: Pier
    CFBundleDisplayName: Pier
    NSHumanReadableCopyright: MIT License
dmg:
  artifactName: Pier-${version}-${arch}.${ext}
npmRebuild: true
afterPack: build/after-pack.cjs
